name: CI / Publish

# Tag strategy (Watchtower-friendly):
#   push to main          → :main, :latest                   (continuous deploy)
#   push tag v1.2.3       → :1.2.3, :1.2, :1, :latest        (stable release)
#   push tag v2.0.0-rc.1  → :2.0.0-rc.1 only                 (prerelease; safe to skip)
#   push tag v2.0.0-bk    → :2.0.0-bk only                   (breaking; do NOT move :latest)
#
# Anything with a `-suffix` is treated as a prerelease and only its exact
# version is published. Watchtower tracking `:latest` deploys every merge to
# main; pin `:1` or `:1.2` to follow stable releases only.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            agent/package-lock.json

      # Stdlib-only (node:test) — needs no npm install, no docker stack.
      # Runs first so unit failures fail fast before the stack boots.
      - name: Unit tests (agent)
        working-directory: ./agent
        run: npm test

      - name: Install test dependencies
        working-directory: ./tests
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      # The compose file mounts ./agent over /opt/agent, hiding the
      # image-baked node_modules — without seeding them here the entrypoint
      # cold-installs from the registry inside the container, racing the
      # 5-minute readiness budget below (the old flake). The .lock-hash stamp
      # makes the entrypoint skip its install, and mid-suite container
      # restarts (migrate.spec) stay instant.
      - name: Install agent dependencies (compose mounts ./agent)
        working-directory: ./agent
        run: |
          npm ci --omit=dev
          sha256sum package-lock.json | cut -d' ' -f1 > node_modules/.lock-hash

      - name: Bring up the stack
        run: docker compose up -d --build

      - name: Wait for the agent to come up
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "agent ready after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "::error::agent never came up"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run Playwright tests
        working-directory: ./tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && hashFiles('tests/playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: tests/playwright-report/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Build & push ${{ matrix.image }}
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dogeclaw
            context: .
            dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # See header for the policy summary.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
